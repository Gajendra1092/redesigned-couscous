<!doctype html>
<html>
  <head>
    <title>Video Upload Test</title>
    <style>
      #qualityControls button {
        margin-right: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h2>Upload Video</h2>

    <input type="file" id="fileInput" />
    <br /><br />
    <button onclick="upload()">Upload</button>

    <pre id="log"></pre>

    <hr />

    <h2>Play Video</h2>

    <input
      type="text"
      id="videoIdInput"
      placeholder="Enter videoId"
      style="width: 400px"
    />
    <button onclick="loadVideo()">Load Video</button>
    <button onclick="deleteVideo()">Delete Video</button>

    <br /><br />

    <!-- Thumbnail -->
    <img id="thumbnail" width="320" style="display:none" />

    <br /><br />

    <!-- 🔥 Video Player -->
    <video
      id="videoPlayer"
      controls
      width="720"
      style="display:none"
    ></video>

    <br /><br />

    <!-- 🎯 Quality Controls -->
    <div id="qualityControls" style="display:none">
      <strong>Quality:</strong>
      <button onclick="setQuality(-1)">Auto</button>
      <!-- Dynamic buttons injected from script.js -->
    </div>

    <!-- ✅ HLS.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>
  </body>
</html>
