<!DOCTYPE html>
<html>
  <head>
    <title>Video Upload Test</title>
  </head>
  <body>
    <h2>Upload Video</h2>

    <input type="file" id="fileInput" />
    <br /><br />
    <button onclick="upload()">Upload</button>

    <pre id="log"></pre>

    <hr />

    <h2>Play Video</h2>

    <input
      type="text"
      id="videoIdInput"
      placeholder="Enter videoId"
      style="width: 400px"
    />
    <button onclick="loadVideo()">Load Video</button>
    <button onclick="deleteVideo()">Delete Video</button>

    <br /><br />

    <!-- 🔥 Video Player -->
    <video
      id="videoPlayer"
      controls
      width="720"
      style="display:none"
    ></video>

    <br /><br />

    <img
      id="thumbnail"
      width="320"
      style="display:none"
    />

    <!-- ✅ HLS.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>
  </body>
</html>
